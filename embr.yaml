components:
  - name: web
    rootDirectory: web
    role: web
    path: /
    run:
      port: 3000
      start: node server.js
      healthCheckPath: /

  - name: api
    rootDirectory: services/api
    role: web
    platform: nodejs
    path: /api
    run:
      port: 8080
      start: npm start
      healthCheckPath: /api/health
